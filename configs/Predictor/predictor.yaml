_target_: src.models.crosspredictor.RenderPredictor
#_target_: src.models.predictor.TransformerPosePredictor

# OTHER HYPERPARAMETERS
embed_dim: 768          # dim interna del transformer, dove tutto viene proiettato
num_heads: 12
depth: 6                # profondita' dello stage1 (cross-attn context -> pose latent)
expand_depth: 2         # profondita' dello stage2 (pose latent -> griglia spaziale)
grid_size: 16           # 16x16 = 256 patch, deve combaciare col grid_size del dataset
mlp_dim: null           # null -> embed_dim * 4
dropout: 0.2
pose_fourier_bands: 10  # rinominato da pos_fourier_bands
use_rot6d: true          # dir_fourier_bands rimosso: non esiste in RenderPredictor