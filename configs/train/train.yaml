loader:
  batch_size: 64            #32
  num_workers: 4

trainer:
  lr: 3e-4
  weight_decay: 0.05
  epochs: 50
  steps_per_epoch: 1200
  val_steps: 100
  warmup_frac: 0.03
  min_lr_ratio: 0.01
  log_every: 20
  ckpt_every: 5
  val_every: 1
  early_stop_patience: 8
  early_stop_min_delta: 0.0
  resume: null    # PATH TO CHECHPOINT 


trainable_components: [predictor]